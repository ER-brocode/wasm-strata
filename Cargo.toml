[package]
name = "wasm-strata"
version = "0.1.0"
edition = "2021"
authors = ["koushik4475 <koushik4475@gmail.com>"]
description = "Sub-50us WebAssembly Sandboxed Micro-Runtime & Edge FaaS Engine with Deterministic Fuel Metering and Capability Sandboxing"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ER-brocode/wasm-strata"
readme = "README.md"
keywords = ["webassembly", "wasmtime", "serverless", "faas", "sandbox"]
categories = ["wasm", "network-programming", "asynchronous"]

[dependencies]
wasmtime = { version = "24.0.0", default-features = false, features = ["cranelift", "pooling-allocator", "async", "demangle"] }
wasmtime-wasi = { version = "24.0.0" }
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1.80"
parking_lot = "0.12.3"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
thiserror = "1.0.61"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
bytes = "1.6.0"
dashmap = "5.5.3"
clap = { version = "4.5.7", features = ["derive"] }
futures = "0.3.30"
anyhow = "1.0.86"
matchit = "0.7.3"

[dev-dependencies]
wat = "1.214.0"
tokio-test = "0.4.4"

[[bin]]
name = "wasm-strata"
path = "src/bin/main.rs"

[lib]
name = "wasm_strata"
path = "src/lib.rs"
